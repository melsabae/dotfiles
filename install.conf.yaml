- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    # directories in this repo root that need to be linked
    ~/.config/bash:
        path: bash
    ~/.config/cmus:
        path: cmus
    ~/.config/formatting:
        path: formatting
    ~/.config/git:
        path: git
    ~/.config/kitty:
        path: kitty
    ~/.config/termite:
        path: termite
    ~/.vim:
        path: vim
    ~/.config/alacritty:
        path: alacritty
    ~/.config/systemd:
        path: systemd
    ~/.config/htop:
        path: htop
    ~/.config/trizen:
        path: trizen


    # files in this repo root that need to be linked
    ~/.config/dircolors:
        path: dircolors
    ~/.config/inputrc:
        path: inputrc
    ~/.config/locale.conf:
        path: locale.conf
    ~/.config/tmux.conf:
        path: tmux.conf
    ~/.config/.pastebinit.xml:
        path: misc/pastebinit.xml
    ~/bin/git_subcommands:
        path: git/subcommands
    ~/.Xresources:
        path: Xresources


    # files in a subdir in this repo that need to be linked
    ~/.bash_profile:
        path: bash/bash_profile
    ~/.bashrc:
        path: bash/bashrc
    ~/.local/share/nemo/actions/clamscan.nemo_action:
        path: local/share/nemo/actions/clamscan.nemo_action
    ~/.local/share/applications/firefox.desktop:
        path: local/share/applications/firefox.desktop
    ~/bin/colors.sh:
        path: scripts/colors.sh
    ~/bin/ps.py:
        path: scripts/ps.py
    ~/.config/gdb/gdbinit:
        path: gdb-dashboard/.gdbinit

- shell:
  - git submodule update --recursive --init

